name: Research — weekly index update

# Pull new arXiv papers, classify whatever has no answer yet, commit both.
#
# Runs on and commits to `main`. That is load-bearing rather than incidental:
# deploy.yml fires on push to main, so data committed anywhere else would
# update the corpus and never reach the published page. An earlier version
# committed to a feature branch and the site would have silently frozen while
# every run reported success.
#
# GitHub only fires `schedule` and `workflow_dispatch` for workflows on the
# default branch, so this file has to live here regardless.
#
# Cost, measured rather than assumed: ~400 tokens of abstract plus ~613 of
# questions per paper at $0.042 per million input tokens. The entire
# 4,683-paper backlog is about $0.20 and a week of new papers about $0.002 —
# roughly ten cents a year. The guard against a runaway loop is --max-spend,
# not a human.

on:
  schedule:
    # Mondays 06:17 UTC. Offset from the hour so it is not queued behind
    # everyone else's cron.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      max_spend:
        description: 'Stop after roughly this many dollars'
        default: '5'

permissions:
  contents: write

# Shared verbatim with research-classify. Both push to main, and a group keyed
# on github.ref would put a run dispatched from a different ref in a different
# group — which is exactly how two jobs end up racing for the same branch.
concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A full backlog runs sequentially. Later runs have ~46 papers and finish
    # in a minute. A run cut off here still commits what it bought, and the
    # next one resumes from that rather than re-paying.
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Depth chosen from what is stored: backfill the field when the corpus is
      # thin, newest-only once it is full. fetch-arxiv merges and never drops
      # what it has, so a corpus lost to a fresh checkout repairs itself.
      - name: Fetch new papers
        run: |
          have=$(node -e 'try { console.log(require("./research/data/papers.json").length) } catch { console.log(0) }')
          if [ "$have" -lt 2000 ]; then max=5000; else max=400; fi
          echo "corpus holds $have papers; fetching up to $max"
          node research/fetch-arxiv.mjs --max "$max"

      - name: How much is outstanding
        run: |
          node -e '
            const p = require("./research/data/papers.json");
            const todo = p.filter(x => Object.keys(x.decisions || {}).length === 0).length;
            console.log(`${p.length} papers, ${todo} with no decisions yet`);
            console.log(`rough cost if all are classified: $${(todo * 1013 * 0.042 / 1e6).toFixed(3)}`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      # No --limit: a scheduled run should finish the work rather than leave a
      # remainder for someone to notice. --max-spend is the ceiling instead.
      # The input goes through env rather than into the run: line, so a crafted
      # dispatch value cannot become shell.
      - name: Classify everything outstanding
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_ENDPOINT: ${{ vars.JEV_ENDPOINT }}
          MAX_SPEND: ${{ inputs.max_spend || '5' }}
        run: node research/classify-jev.mjs --max-spend "$MAX_SPEND"

      - name: What the index looks like now
        if: always()
        run: node research/report.mjs --all 2>/dev/null | head -60 | tee -a "$GITHUB_STEP_SUMMARY" || true

      # always(), because a run cut short by the timeout has still bought real
      # decisions and checkpointed them. Committing is what lets the next run
      # resume instead of starting over.
      - name: Commit the update
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/papers.json
          if git diff --staged --quiet; then
            echo "nothing changed this week"
          else
            git commit -m "Weekly index update: new papers and classifications"
            # Rebase before pushing: a long backlog run can take hours, and a
            # person may well have pushed to main in the meantime.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

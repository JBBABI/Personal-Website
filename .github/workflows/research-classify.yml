name: Research — classify a subset

# The ad-hoc classifier, for when you want a PARTICULAR set of papers rather
# than everything outstanding — classifying the gold cohort, say, with a
# matching --sample seed. The routine work is research-weekly.yml.
#
# This was once manual "because it costs money". Measured, the whole corpus is
# about $0.20, so cost was never the reason. It stays manual because it is a
# targeting tool, not because spending is dangerous.
#
# Needs secret JEV_API_KEY. Set repo variable JEV_ENDPOINT only if the real
# endpoint differs from the default in classify-jev.mjs.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many papers to classify'
        default: '60'
      sample:
        description: 'Seed for spreading the sample across the corpus (blank = newest first)'
        default: '7'

permissions:
  contents: write

# Identical to research-weekly's group, and deliberately a literal. Keying it
# on github.ref instead put a run dispatched from another ref into a different
# group, so the two workflows could push to main concurrently and the loser was
# rejected non-fast-forward.
concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately does not re-fetch. An earlier version rebuilt the corpus
      # from scratch every run, which discarded every decision already paid for
      # and bought them again — the per-question cache could never fire because
      # the file it caches into was always new.
      - name: Check the corpus is there
        run: |
          test -f research/data/papers.json || {
            echo "No corpus committed. Run 'Research — weekly index update' first."
            exit 1
          }
          node -e 'const p=require("./research/data/papers.json");
            const done=p.filter(x=>Object.keys(x.decisions||{}).length).length;
            console.log(`corpus: ${p.length} papers, ${done} already carry decisions`)'

      - name: Show the payload before spending anything
        run: node research/classify-jev.mjs --dry-run

      # Inputs travel via env, never interpolated into the run: line — a
      # dispatch value substituted straight into shell is an injection with
      # write access to the repository.
      - name: Classify
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_ENDPOINT: ${{ vars.JEV_ENDPOINT }}
          LIMIT: ${{ inputs.limit || '60' }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          args=(--limit "$LIMIT")
          [ -n "$SAMPLE" ] && args+=(--sample "$SAMPLE")
          node research/classify-jev.mjs "${args[@]}"

      # head, because the step summary is dropped whole once it passes 1MiB and
      # report.mjs over a few thousand papers comfortably exceeds that.
      - name: What came back
        if: always()
        run: node research/report.mjs 2>/dev/null | head -60 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the decisions
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/papers.json
          if git diff --staged --quiet; then
            echo "no new decisions to commit"
          else
            git commit -m "Classify papers with Jev"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

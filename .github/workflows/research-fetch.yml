name: Research — fetch arXiv

# Runs on a GitHub runner because that has open internet. Triggers on push to
# this branch so the first run needs no setup, plus manual dispatch later.
on:
  push:
    branches: [research-pipeline]
    paths:
      - 'research/**'
      - '.github/workflows/research-fetch.yml'
  workflow_dispatch:
    inputs:
      max:
        description: 'Maximum papers to fetch (blank = decide from what is stored)'
        required: false

# Needed to commit the corpus back. The corpus is the database — see below.
permissions:
  contents: write

# Both research workflows push to this branch. Without a shared concurrency
# group a fetch and a classify can race and one loses its commit.
concurrency:
  group: research-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Depth is chosen from what is already stored rather than fixed.
      #
      # The two cases genuinely differ. A thin corpus needs backfilling across
      # the whole field — arXiv reports ~4,700 papers matching the seed terms,
      # and a gold set drawn from only the newest 400 samples about one month
      # of it, which would measure agreement on one month's topics and publish
      # it as the index's error rate. A full corpus needs only the newest
      # papers, because fetch-arxiv merges and never drops what it already has.
      #
      # Deciding here rather than passing --max by hand also means a corpus
      # lost to a fresh checkout repairs itself on the next push, instead of
      # waiting for someone to notice it is short.
      - name: Fetch candidates from arXiv
        run: |
          have=$(node -e 'try { console.log(require("./research/data/papers.json").length) } catch { console.log(0) }')
          max="${{ inputs.max }}"
          if [ -z "$max" ]; then
            if [ "$have" -lt 2000 ]; then max=5000; else max=400; fi
          fi
          echo "corpus holds $have papers; fetching up to $max"
          node research/fetch-arxiv.mjs --max "$max"

      - name: Summarise what came back
        run: |
          echo "## arXiv fetch" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const p = require("./research/data/papers.json");
            console.log("TOTAL:", p.length);
            const years = {};
            for (const x of p) years[x.published.slice(0,7)] = (years[x.published.slice(0,7)]||0)+1;
            console.log("\nBY MONTH:");
            for (const [m,n] of Object.entries(years).sort().reverse().slice(0,12))
              console.log("  " + m + "  " + n);
            console.log("\nFIRST 25 TITLES:");
            p.slice(0,25).forEach((x,i) =>
              console.log(`  ${String(i+1).padStart(2)}. [${x.arxiv_id}] ${x.title.slice(0,95)}`));
            const cats = {};
            for (const x of p) for (const c of x.categories) cats[c] = (cats[c]||0)+1;
            console.log("\nTOP CATEGORIES:");
            Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,10)
              .forEach(([c,n]) => console.log("  " + c + "  " + n));
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      # The corpus is committed, not kept as an artifact. It used to be
      # uploaded with 30-day retention and nothing else, which meant every
      # classification expired: a paid-for decision could not outlive the run
      # that bought it, and the per-question version cache — the whole reason
      # retuning is cheap — never survived to be used. Committing also gives
      # the audit trail the README promises, because a changed classification
      # then shows up as a reviewable diff.
      - name: Commit the corpus
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/papers.json
          if git diff --staged --quiet; then
            echo "corpus unchanged, nothing to commit"
          else
            git commit -m "Update arXiv corpus"
            git push origin HEAD:research-pipeline
          fi
